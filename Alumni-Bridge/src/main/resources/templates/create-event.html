<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Event | Alumni Bridge</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: #f4f6f9; padding-top: 80px; font-family: 'Segoe UI', sans-serif; }
.card { border-radius: 15px; border: none; }
</style>
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container col-md-6 mb-5">

    <div class="card p-4 shadow">

        <h3 class="mb-4 text-center fw-bold">📅 Schedule an Event</h3>

        <div th:if="${error}" class="alert alert-danger text-center">
            <span th:text="${error}"></span>
        </div>

        <form th:action="@{/save-event}" method="post">

            <div class="mb-3">
                <label class="form-label fw-semibold">Event Title *</label>
                <input type="text" name="title" class="form-control" placeholder="e.g. Annual Alumni Reunion, Tech Talk on AI" required>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Date *</label>
                    <input type="date" name="date" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Time</label>
                    <input type="text" name="time" class="form-control" placeholder="e.g. 6:00 PM EST">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Location / Mode</label>
                    <input type="text" name="location" class="form-control" placeholder="e.g. Campus Auditorium / Virtual">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Virtual Meeting Link</label>
                    <input type="url" name="meetingLink" class="form-control" placeholder="https://meet.google.com/...">
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Event Description</label>
                <textarea name="description" class="form-control" rows="4" placeholder="Agenda, guest speakers, key topics..."></textarea>
            </div>

            <div class="d-flex gap-2 mt-4">
                <a href="/events" class="btn btn-outline-secondary w-50">Cancel</a>
                <button class="btn btn-primary w-50 fw-bold">Create Event</button>
            </div>

        </form>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
