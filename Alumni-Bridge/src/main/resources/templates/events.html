<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Events | Alumni Bridge</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background: #f4f6f9;
	padding-top: 70px;
	font-family: 'Segoe UI', sans-serif;
	display: flex;
	flex-direction: column;
	min-height: 100vh;
}

.card {
	border-radius: 12px;
	border: none;
	transition: 0.3s;
	height: 100%;
	display: flex;
	flex-direction: column;
	justify-content: space-between;
}

.card:hover {
	transform: translateY(-5px);
}

.truncate {
	display: inline-block;
	max-width: 150px;
	white-space: nowrap;
	overflow: hidden;
	text-overflow: ellipsis;
	vertical-align: bottom;
}
</style>
</head>

<body>

	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="container mt-4">

		<div class="d-flex justify-content-between align-items-center mb-4">
			<h3>📅 Community & Campus Events</h3>
			<a
				th:if="${session.loggedUser.role == 'ALUMNI' or session.loggedUser.role == 'ADMIN'}"
				href="/create-event" class="btn btn-primary"> + Create Event </a>
		</div>

		<div th:if="${#lists.isEmpty(events)}" class="card shadow p-5 text-center">
			<h5 class="text-muted">No scheduled events at this time.</h5>
		</div>

		<div class="row g-4">

			<div class="col-md-4" th:each="event : ${events}">
				<div class="card shadow p-3">

					<div>
						<h5 class="fw-bold" th:text="${event.title}">Event Title</h5>

						<p class="text-muted small" th:text="${event.description}">Description</p>

						<div class="p-2 bg-light rounded mb-3 small">
							<div>📍 <b>Location:</b> <span th:text="${event.location != null ? event.location : 'Campus'}">Location</span></div>
							<div>📅 <b>Date:</b> <span th:text="${event.date}">Date</span></div>
							<div th:if="${event.time != null}">⏰ <b>Time:</b> <span th:text="${event.time}">10:00 AM</span></div>
						</div>

						<p class="text-muted small">
							👤 Created by: 
							<a th:if="${event.createdBy != null}" th:href="@{'/view-user/' + ${event.createdBy.id}}"
								class="text-decoration-none fw-bold"> 
								<span th:text="${event.createdBy.name}" class="truncate" th:title="${event.createdBy.name}"></span>
							</a>
							<span th:if="${event.createdBy == null}" class="text-muted">AlumniBridge</span>
						</p>
					</div>

					<div class="mt-auto">
						<div class="d-flex gap-2">
							<!-- Organizer attendee management button -->
							<a th:if="${event.createdBy != null and (event.createdBy.id == session.loggedUser.id or session.loggedUser.role == 'ADMIN')}"
							   th:href="@{'/events/' + ${event.id} + '/attendees'}" 
							   class="btn btn-outline-info btn-sm flex-grow-1">
								Attendees
							</a>

							<!-- REGISTER BUTTON using batch-preloaded registeredEventIds Set -->
							<div th:if="${!registeredEventIds.contains(event.id)}" class="flex-grow-1">
								<a th:href="@{'/register-event/' + ${event.id}}"
									class="btn btn-success btn-sm w-100"> Register </a>
							</div>

							<div th:if="${registeredEventIds.contains(event.id)}" class="flex-grow-1">
								<button class="btn btn-secondary btn-sm w-100" disabled>✔ Registered</button>
							</div>
						</div>
					</div>

				</div>
			</div>

		</div>

	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
