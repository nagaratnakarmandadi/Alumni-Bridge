<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Jobs | Admin</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background: #f4f6f9;
	padding-top: 70px;
	font-family: 'Segoe UI', sans-serif;
}

.card {
	border: none;
	border-radius: 15px;
	display: flex;
	flex-direction: column;
	justify-content: space-between;
}
</style>
</head>

<body>

	<!-- ADMIN NAVBAR -->
	<div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>

	<div class="container">

		<h3 class="mb-4">💼 Manage Jobs</h3>

		<div th:if="${#lists.isEmpty(jobs)}" class="card shadow p-5 text-center">
			<h5 class="text-muted">No active job listings.</h5>
		</div>

		<div class="row g-4">

			<div class="col-md-4" th:each="job : ${jobs}">
				<div class="card shadow p-3 h-100">

					<div>
						<h5 class="fw-bold" th:text="${job.title}">Job Title</h5>

						<p class="mb-1">
							<b>🏢 Company:</b> <span th:text="${job.company}">Company</span>
						</p>
						<p class="mb-1">
							<b>📍 Location:</b> <span th:text="${job.location != null ? job.location : 'Flexible'}">Location</span>
						</p>

						<p class="text-muted small">
							👤 Posted by: <span th:text="${job.postedBy != null ? job.postedBy.name : 'AlumniBridge'}">Poster</span>
						</p>
					</div>

					<div class="mt-3 pt-2 border-top">
						<div class="d-flex gap-2">
							<a th:href="@{'/jobs/' + ${job.id} + '/applications'}"
								class="btn btn-outline-info btn-sm flex-grow-1">View Applicants</a>
							<a th:href="@{'/admin/delete-job/' + ${job.id}}"
								onclick="return confirm('Are you sure you want to permanently delete this job posting? All candidate applications will also be removed.');"
								class="btn btn-danger btn-sm">Delete</a>
						</div>
					</div>

				</div>
			</div>

		</div>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
