<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Details | Alumni Bridge</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background: #f4f6f9; padding-top: 80px; font-family: 'Segoe UI', sans-serif; }
.job-card { border-radius: 15px; border: none; }
.badge-custom { padding: 8px 14px; border-radius: 20px; font-size: 0.85rem; }
.section-heading { font-weight: 600; color: #0d6efd; margin-top: 20px; }
</style>
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container col-md-8">
    <div class="card shadow p-4 job-card">
        <div class="d-flex justify-content-between align-items-start mb-3">
            <div>
                <h3 class="fw-bold" th:text="${job.title}">Job Title</h3>
                <h5 class="text-muted" th:text="${job.company}">Company</h5>
            </div>
            <span class="badge bg-primary badge-custom" th:text="${job.jobType != null ? job.jobType : 'Full-time'}">Full-time</span>
        </div>

        <div class="row g-3 my-2 p-3 bg-light rounded">
            <div class="col-md-4">
                <small class="text-muted">📍 Location</small>
                <div class="fw-semibold" th:text="${job.location != null ? job.location : 'Not specified'}">Location</div>
            </div>
            <div class="col-md-4">
                <small class="text-muted">💰 Compensation</small>
                <div class="fw-semibold" th:text="${job.salary != null ? job.salary : 'Competitive'}">Salary</div>
            </div>
            <div class="col-md-4">
                <small class="text-muted">👤 Posted By</small>
                <div>
                    <a th:if="${job.postedBy != null}" th:href="@{'/view-user/' + ${job.postedBy.id}}" 
                       class="fw-semibold text-decoration-none" th:text="${job.postedBy.name}">Poster</a>
                    <span th:if="${job.postedBy == null}" class="text-muted">AlumniBridge</span>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <h6 class="section-heading">Detailed Description & Requirements</h6>
            <div class="p-3 bg-white border rounded mt-2" style="white-space: pre-line;" th:text="${job.description}">
                Job description...
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
            <a href="/jobs" class="btn btn-outline-secondary">⬅ Back to Jobs</a>

            <div class="d-flex gap-2">
                <!-- If poster or admin, show review applicants link -->
                <a th:if="${isOwner}" th:href="@{'/jobs/' + ${job.id} + '/applications'}" class="btn btn-outline-primary">
                    👥 View Applicants
                </a>

                <!-- Apply button -->
                <div th:if="${!isApplied}">
                    <a th:href="@{'/apply/' + ${job.id}}" class="btn btn-success px-4">
                        🚀 Apply Now
                    </a>
                </div>
                <div th:if="${isApplied}">
                    <button class="btn btn-secondary px-4" disabled>✔ Already Applied</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
