<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Events | Admin</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background: #f4f6f9;
	padding-top: 70px;
	font-family: 'Segoe UI', sans-serif;
}

.card {
	border: none;
	border-radius: 15px;
	display: flex;
	flex-direction: column;
	justify-content: space-between;
}
</style>
</head>

<body>

	<!-- ADMIN NAVBAR -->
	<div th:replace="~{fragments/admin-navbar :: adminNavbar}"></div>

	<div class="container">

		<h3 class="mb-4">📅 Manage Events</h3>

		<div th:if="${#lists.isEmpty(events)}" class="card shadow p-5 text-center">
			<h5 class="text-muted">No scheduled events.</h5>
		</div>

		<div class="row g-4">

			<div class="col-md-4" th:each="event : ${events}">
				<div class="card shadow p-3 h-100">

					<div>
						<h5 class="fw-bold" th:text="${event.title}">Event Title</h5>

						<p class="text-muted small" th:text="${event.description}">Description</p>

						<div class="p-2 bg-light rounded small mb-2">
							<div>📍 <span th:text="${event.location != null ? event.location : 'Campus'}">Location</span></div>
							<div>📅 <span th:text="${event.date}">Date</span></div>
						</div>

						<p class="text-muted small">
							👤 Created by: <span th:text="${event.createdBy != null ? event.createdBy.name : 'AlumniBridge'}">Creator</span>
						</p>
					</div>

					<div class="mt-3 pt-2 border-top">
						<div class="d-flex gap-2">
							<a th:href="@{'/events/' + ${event.id} + '/attendees'}"
								class="btn btn-outline-info btn-sm flex-grow-1">Attendees</a>
							<a th:href="@{'/admin/delete-event/' + ${event.id}}"
								onclick="return confirm('Are you sure you want to permanently delete this event? All attendee registrations will also be removed.');"
								class="btn btn-danger btn-sm">Delete</a>
						</div>
					</div>

				</div>
			</div>

		</div>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
