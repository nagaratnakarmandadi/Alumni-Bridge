<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobs | Alumni Bridge</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background: #f4f6f9;
	padding-top: 70px;
	font-family: 'Segoe UI', sans-serif;
}

.card {
	border-radius: 12px;
	border: none;
	transition: 0.3s;
	display: flex;
	flex-direction: column;
	justify-content: space-between;
}

.card:hover {
	transform: translateY(-5px);
}
</style>

</head>

<body>

	<!-- NAVBAR -->
	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="container mt-4">

		<div class="d-flex justify-content-between align-items-center mb-4">
			<h3>💼 Career Opportunities</h3>

			<!-- ROLE BASED POST -->
			<a
				th:if="${session.loggedUser.role == 'ALUMNI' or session.loggedUser.role == 'ADMIN'}"
				href="/post-job" class="btn btn-primary"> + Post Job </a>
		</div>

		<div th:if="${errorMessage}" class="alert alert-warning alert-dismissible fade show">
			<span th:text="${errorMessage}"></span>
		</div>

		<div th:if="${#lists.isEmpty(jobs)}" class="card shadow p-5 text-center">
			<h5 class="text-muted">No job postings available at this time.</h5>
		</div>

		<div class="row g-4">

			<div class="col-md-4" th:each="job : ${jobs}">
				<div class="card shadow p-3 h-100">

					<div>
						<!-- TITLE -->
						<h5 class="fw-bold mb-1">
							<a th:href="@{'/jobs/' + ${job.id}}" class="text-dark text-decoration-none" th:text="${job.title}">Job Title</a>
						</h5>

						<!-- DETAILS -->
						<p class="mb-1 text-primary fw-semibold">
							🏢 <span th:text="${job.company}">Company</span>
						</p>

						<p class="mb-1 text-muted small">
							📍 <span th:text="${job.location != null ? job.location : 'Flexible'}">Location</span>
						</p>

						<!-- CLICKABLE POSTED BY -->
						<p class="text-muted small mb-3">
							👤 Posted by: 
							<a th:if="${job.postedBy != null}" th:href="@{'/view-user/' + ${job.postedBy.id}}"
								class="fw-bold text-decoration-none"> <span
								th:text="${job.postedBy.name}"></span>
							</a>
							<span th:if="${job.postedBy == null}" class="text-muted">AlumniBridge</span>
						</p>
					</div>

					<div class="mt-auto">
						<div class="d-flex gap-2">
							<a th:href="@{'/jobs/' + ${job.id}}" class="btn btn-outline-secondary btn-sm flex-grow-1">
								Details
							</a>

							<!-- View Applicants button for job poster or admin -->
							<a th:if="${job.postedBy != null and (job.postedBy.id == session.loggedUser.id or session.loggedUser.role == 'ADMIN')}" 
							   th:href="@{'/jobs/' + ${job.id} + '/applications'}" 
							   class="btn btn-outline-info btn-sm">
								Applicants
							</a>

							<!-- APPLY BUTTON using batch-preloaded appliedJobIds Set -->
							<div th:if="${job.postedBy != null and job.postedBy.id == session.loggedUser.id}">
								<span class="badge bg-secondary p-2">Your Post</span>
							</div>

							<div th:if="${job.postedBy == null or job.postedBy.id != session.loggedUser.id}">
								<div th:if="${!appliedJobIds.contains(job.id)}">
									<a th:href="@{'/apply/' + ${job.id}}" class="btn btn-primary btn-sm px-3"> 
										Apply 
									</a>
								</div>

								<div th:if="${appliedJobIds.contains(job.id)}">
									<button class="btn btn-success btn-sm px-3" disabled>
										✔ Applied
									</button>
								</div>
							</div>
						</div>
					</div>

				</div>
			</div>

		</div>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
