<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post Career Opportunity | Alumni Bridge</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">
<style>
body { background: #f4f6f9; padding-top: 80px; font-family: 'Segoe UI', sans-serif; }
.card { border-radius: 15px; border: none; }
</style>
</head>

<body>

	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="container col-md-6 mb-5">

		<div class="card shadow p-4">

			<h3 class="mb-4 text-center fw-bold">💼 Post a Job Opening</h3>

			<div th:if="${error}" class="alert alert-danger text-center">
				<span th:text="${error}"></span>
			</div>

			<form th:action="@{/save-job}" method="post" th:object="${job}">

				<div class="mb-3">
					<label class="form-label fw-semibold">Job Title *</label>
					<input type="text" class="form-control" placeholder="e.g. Junior Java Developer, Product Intern"
						th:field="*{title}" required>
				</div>

				<div class="row mb-3">
					<div class="col-md-6">
						<label class="form-label fw-semibold">Company Name *</label>
						<input type="text" class="form-control" placeholder="e.g. Acme Corp"
							th:field="*{company}" required>
					</div>
					<div class="col-md-6">
						<label class="form-label fw-semibold">Location</label>
						<input type="text" class="form-control" placeholder="e.g. Remote / New York, NY"
							th:field="*{location}">
					</div>
				</div>

				<div class="row mb-3">
					<div class="col-md-6">
						<label class="form-label fw-semibold">Employment Type</label>
						<select class="form-select" th:field="*{jobType}">
							<option value="Full-time">Full-time</option>
							<option value="Internship">Internship</option>
							<option value="Part-time">Part-time</option>
							<option value="Contract">Contract</option>
						</select>
					</div>
					<div class="col-md-6">
						<label class="form-label fw-semibold">Compensation / Salary</label>
						<input type="text" class="form-control" placeholder="e.g. $70k - $85k, $30/hr"
							th:field="*{salary}">
					</div>
				</div>

				<div class="row mb-3">
					<div class="col-md-6">
						<label class="form-label fw-semibold">Experience Level</label>
						<input type="text" class="form-control" placeholder="e.g. Fresher, 1-3 years"
							th:field="*{experienceRequired}">
					</div>
					<div class="col-md-6">
						<label class="form-label fw-semibold">Application Deadline</label>
						<input type="date" class="form-control" th:field="*{deadline}">
					</div>
				</div>

				<div class="mb-3">
					<label class="form-label fw-semibold">Detailed Job Description & Requirements *</label>
					<textarea class="form-control" rows="5"
						placeholder="Responsibilities, technical qualifications, how candidates will be evaluated..."
						th:field="*{description}" required></textarea>
				</div>

				<div class="d-flex gap-2 mt-4">
					<a href="/jobs" class="btn btn-outline-secondary w-50">Cancel</a>
					<button class="btn btn-primary w-50 fw-bold">Publish Job</button>
				</div>

			</form>

		</div>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
