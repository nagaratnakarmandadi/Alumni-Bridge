<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat | Alumni Bridge</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background: #f4f6f9;
	padding-top: 70px;
	font-family: 'Segoe UI', sans-serif;
}

.chat-box {
	height: 420px;
	overflow-y: auto;
	background: #ffffff;
	padding: 15px;
	border-radius: 12px;
	border: 1px solid #e9ecef;
}

/* MESSAGE ALIGNMENT */
.msg-left {
	text-align: left;
	margin-bottom: 12px;
}

.msg-right {
	text-align: right;
	margin-bottom: 12px;
}

/* CHAT BUBBLES */
.bubble-left {
	background: #f1f3f5;
	color: #212529;
	padding: 10px 14px;
	border-radius: 14px 14px 14px 2px;
	display: inline-block;
	max-width: 75%;
	text-align: left;
}

.bubble-right {
	background: #0d6efd;
	color: white;
	padding: 10px 14px;
	border-radius: 14px 14px 2px 14px;
	display: inline-block;
	max-width: 75%;
	text-align: left;
}

/* TIME + STATUS */
.time {
	font-size: 11px;
	color: #888;
	margin-top: 3px;
	display: inline-block;
}

.status {
	font-size: 11px;
	color: #0d6efd;
}
</style>
</head>

<body>

	<!-- NAVBAR -->
	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="container col-md-6 mt-3">

		<div class="card shadow p-3 border-0 rounded-4">

			<!-- HEADER -->
			<div class="d-flex justify-content-between align-items-center pb-2 border-bottom">
				<div class="d-flex align-items-center">
					<a href="/messages" class="btn btn-sm btn-outline-secondary me-2">⬅</a>
					<div>
						<h5 class="mb-0 fw-bold" th:text="${receiver.name}">Partner</h5>
						<small class="text-muted" th:text="${receiver.role}">ALUMNI</small>
					</div>
				</div>
				<a th:href="@{'/view-user/' + ${receiver.id}}" class="btn btn-sm btn-outline-primary">View Profile</a>
			</div>

			<!-- CHAT AREA -->
			<div class="chat-box mt-3 mb-3">

				<div th:if="${#lists.isEmpty(messages)}" class="text-center text-muted my-5">
					<p>No messages yet. Say hello to <span th:text="${receiver.name}"></span>! 👋</p>
				</div>

				<div th:each="msg : ${messages}">

					<!-- RECEIVED MESSAGE -->
					<div th:if="${msg.sender != null and msg.sender.id == receiver.id}" class="msg-left">
						<div class="bubble-left" th:text="${msg.content}">Message</div>
						<br> 
						<span class="time" th:if="${msg.timestamp != null}"
							th:text="${#temporals.format(msg.timestamp, 'HH:mm')}">Time</span>
					</div>

					<!-- SENT MESSAGE -->
					<div th:if="${msg.sender != null and msg.sender.id != receiver.id}" class="msg-right">
						<div class="bubble-right" th:text="${msg.content}">Message</div>
						<br> 
						<span class="time" th:if="${msg.timestamp != null}"
							th:text="${#temporals.format(msg.timestamp, 'HH:mm')}">Time</span>
						<span class="status ms-1">
							<span th:if="${msg.seen}">✔✔ Seen</span>
							<span th:if="${!msg.seen}">✔ Sent</span>
						</span>
					</div>

				</div>

			</div>

			<!-- INPUT -->
			<form th:action="@{/send-message}" method="post">
				<input type="hidden" name="receiverId" th:value="${receiver.id}">

				<div class="input-group">
					<input type="text" name="content" class="form-control"
						placeholder="Type a message..." required autocomplete="off">
					<button class="btn btn-primary px-4">Send</button>
				</div>
			</form>

		</div>

	</div>

	<!-- AUTO SCROLL FIX -->
	<script>
		const chatBox = document.querySelector('.chat-box');
		if (chatBox) {
			chatBox.scrollTop = chatBox.scrollHeight;
		}
	</script>

	<!-- BOOTSTRAP -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
