<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Events | Alumni Bridge</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background: #f4f6f9;
	padding-top: 70px;
	font-family: 'Segoe UI', sans-serif;
}

.card {
	border-radius: 12px;
	border: none;
}
</style>
</head>

<body>

	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="container mt-4">

		<h3 class="mb-4">🎟️ My Registered Events</h3>

		<div th:if="${#lists.isEmpty(registrations)}" class="card shadow p-5 text-center">
			<h5 class="text-muted">You haven't registered for any events yet.</h5>
			<div class="mt-2">
				<a href="/events" class="btn btn-primary btn-sm">Explore Upcoming Events</a>
			</div>
		</div>

		<div class="row g-4" th:if="${!#lists.isEmpty(registrations)}">

			<div class="col-md-4" th:each="reg : ${registrations}">
				<div class="card shadow p-3" th:if="${reg.event != null}">

					<h5 class="fw-bold" th:text="${reg.event.title}">Event Title</h5>

					<p class="text-muted small" th:text="${reg.event.description}">Description</p>

					<div class="p-2 bg-light rounded small mb-3">
						<div>📍 <span th:text="${reg.event.location}">Location</span></div>
						<div>📅 <span th:text="${reg.event.date}">Date</span></div>
					</div>

					<div class="d-flex justify-content-between align-items-center">
						<span class="badge bg-success">✔ Registered</span>
						<small class="text-muted" th:text="${reg.registrationDate != null ? reg.registrationDate : 'Confirmed'}"></small>
					</div>

				</div>
			</div>

		</div>

	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
