<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alumni Directory | Alumni Bridge</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background: #f4f6f9;
	font-family: 'Segoe UI', sans-serif;
}

.card {
	border-radius: 12px;
	border: none;
	transition: 0.3s;
	display: flex;
	flex-direction: column;
	justify-content: space-between;
}

.card:hover {
	transform: translateY(-5px);
}

.avatar-directory {
	width: 60px;
	height: 60px;
	border-radius: 50%;
	object-fit: cover;
}
</style>
</head>

<body>

	<div th:replace="~{fragments/navbar :: navbar}"></div>

	<div class="container" style="margin-top: 90px;">

		<h2 class="text-center mb-4">👥 Alumni & Student Directory</h2>

		<div th:if="${errorMessage}" class="alert alert-warning alert-dismissible fade show">
			<span th:text="${errorMessage}"></span>
		</div>

		<form method="get" action="/alumni" class="row g-3 mb-4">

			<div class="col-md-5">
				<input type="text" name="keyword" th:value="${keyword}" class="form-control"
					placeholder="Search members by name...">
			</div>

			<div class="col-md-3">
				<select name="role" class="form-select">
					<option value="" th:selected="${role == ''}">All Roles</option>
					<option value="STUDENT" th:selected="${role == 'STUDENT'}">🎓 Students</option>
					<option value="ALUMNI" th:selected="${role == 'ALUMNI'}">👨‍💼 Alumni</option>
				</select>
			</div>

			<div class="col-md-2">
				<button class="btn btn-primary w-100">Search</button>
			</div>

			<div class="col-md-2">
				<a href="/alumni" class="btn btn-secondary w-100">Reset</a>
			</div>

		</form>

		<div th:if="${#lists.isEmpty(users)}" class="card shadow p-5 text-center my-4">
			<h5 class="text-muted">No members found matching your search.</h5>
		</div>

		<div class="row">

			<div class="col-12 col-sm-6 col-lg-4 mb-4" th:each="u : ${users}">
				<div class="card shadow p-3 h-100">

					<div class="d-flex align-items-center mb-3">
						<img th:src="${u.profileImage != null and !#strings.isEmpty(u.profileImage)} ? 
									(${#strings.startsWith(u.profileImage, 'uploads/')} ? @{'/' + ${u.profileImage}} : @{'/uploads/' + ${u.profileImage}}) : 
									@{/images/default-avatar.svg}"
							 onerror="this.onerror=null;this.src='/images/default-avatar.svg';"
							 class="avatar-directory border me-3"
							 alt="User Avatar">
						<div>
							<h5 class="mb-0 fw-bold" th:text="${u.name}">Name</h5>
							<small class="text-muted" th:text="${u.email}">email</small><br>
							<span class="badge mt-1" 
								  th:classappend="${u.role == 'ALUMNI' ? 'bg-primary' : 'bg-secondary'}"
								  th:text="${u.role}">ROLE</span>
						</div>
					</div>

					<!-- PROFILE PREVIEW -->
					<div class="small text-muted mb-3" th:if="${u.profile != null and (u.profile.company != null or u.profile.skills != null)}">
						<div th:if="${u.profile.company != null and !#strings.isEmpty(u.profile.company)}">
							🏢 <span th:text="${u.profile.company}">Company</span>
						</div>
						<div th:if="${u.profile.skills != null and !#strings.isEmpty(u.profile.skills)}" class="text-truncate">
							🛠 <span th:text="${u.profile.skills}">Skills</span>
						</div>
					</div>
					<div class="small text-muted mb-3" th:if="${u.profile == null or (u.profile.company == null and u.profile.skills == null)}">
						<span class="badge bg-light text-secondary border">Active Member</span>
					</div>

					<div class="mt-auto d-flex gap-2">
						<a th:href="@{'/view-user/' + ${u.id}}"
							class="btn btn-outline-primary btn-sm flex-grow-1"> View Profile </a>
						<a th:href="@{'/chat/' + ${u.id}}"
							class="btn btn-primary btn-sm"> 💬 Chat </a>
					</div>

				</div>
			</div>

		</div>

	</div>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
