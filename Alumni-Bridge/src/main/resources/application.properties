spring.application.name=Alumni-Bridge

# Server
# Uses Railway's PORT when deployed.
# Uses 8127 when running locally.
server.port=${PORT:8127}

# =========================================================
# DATABASE
# =========================================================

# Local development:
# Uses localhost when Railway variables are not available.
spring.datasource.url=${MYSQL_JDBC_URL:jdbc:mysql://localhost:3306/alumni_db}

spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# =========================================================
# THYMELEAF
# =========================================================

spring.thymeleaf.cache=false

# =========================================================
# STATIC FILES / UPLOADS & MULTIPART
# =========================================================

spring.web.resources.static-locations=classpath:/static/,classpath:/public/,file:./uploads/

# Multipart File Upload Limits & Tomcat Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-swallow-size=-1
server.tomcat.max-http-form-post-size=30MB
